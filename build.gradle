// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '2.16.6-26.3'
group = 'net.tigereye.chestcavity'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Opt-in integration tests run inside an isolated GameTest world.
if (providers.gradleProperty('withGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config=chestcavity.mixins.json'

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'chestcavity'
        }

        register('client') {
            if (providers.gradleProperty('smokeTest').isPresent()) {
                args '--quickPlaySingleplayer', 'chestcavity-migration-smoke'
                systemProperty 'chestcavity.smokeTest', 'true'
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            args '--tests', 'chestcavity:*', '--report', 'gametest-results.xml'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'chestcavity', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.8')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

jar { manifest { attributes('MixinConfigs': 'chestcavity.mixins.json') } }
